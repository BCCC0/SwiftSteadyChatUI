name: SwiftSteadyChatUISample
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  SwiftSteadyChatUI:
    path: ../..

targets:
  SwiftSteadyChatUISample:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SwiftSteadyChatUISample
    dependencies:
      - package: SwiftSteadyChatUI
        product: SwiftSteadyChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steadychatui.sample
        PRODUCT_NAME: SwiftSteadyChatUISample
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SteadyChatUI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  SwiftSteadyChatUISample:
    build:
      targets:
        SwiftSteadyChatUISample: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
